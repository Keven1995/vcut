[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcut-workers-runtime"
version = "0.1.0"
description = "Runtime base dos workers de processamento de video do Vcut"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.6",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
vcut-worker = "vcut_workers.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
