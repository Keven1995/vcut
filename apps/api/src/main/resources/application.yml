spring:
  application:
    name: vcut-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_JDBC_URL:${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vcut}}}
    username: ${POSTGRES_USER:vcut}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: ${API_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level correlationId=%X{correlationId} logger=%logger{36} message=%msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${project.version:0.1.0-SNAPSHOT}

vcut:
  storage:
    enabled: ${OBJECT_STORAGE_ENABLED:true}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:vcut-local}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE:true}
    auto-create-bucket: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:true}
    presigned-url-ttl: ${OBJECT_STORAGE_PRESIGNED_URL_TTL:15m}
  upload:
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:536870912}
    max-duration-seconds: ${UPLOAD_MAX_DURATION_SECONDS:7200}
    accepted-extensions: ${UPLOAD_ACCEPTED_EXTENSIONS:mp4,mov,webm}
    accepted-content-types: ${UPLOAD_ACCEPTED_CONTENT_TYPES:video/mp4,video/quicktime,video/webm}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  web:
    allowed-origin: ${WEB_ORIGIN:http://localhost:3000}
  dependencies:
    postgres-host: ${POSTGRES_HOST:localhost}
    postgres-port: ${POSTGRES_PORT:5432}
    rabbitmq-host: ${RABBITMQ_HOST:localhost}
    rabbitmq-port: ${RABBITMQ_PORT:5672}
    storage-health-url: ${OBJECT_STORAGE_HEALTH_URL:http://localhost:9000/minio/health/live}
