spring:
  application:
    name: vcut-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_JDBC_URL:${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vcut}}}
    username: ${POSTGRES_USER:vcut}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    clean-disabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:vcut}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: ${API_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level correlationId=%X{correlationId} logger=%logger{36} message=%msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${project.version:0.1.0-SNAPSHOT}

vcut:
  storage:
    enabled: ${OBJECT_STORAGE_ENABLED:true}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:vcut-local}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE:true}
    auto-create-bucket: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:true}
    capacity-bytes: ${OBJECT_STORAGE_CAPACITY_BYTES:0}
    presigned-url-ttl: ${OBJECT_STORAGE_PRESIGNED_URL_TTL:15m}
  upload:
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:2147483648}
    max-duration-seconds: ${UPLOAD_MAX_DURATION_SECONDS:7200}
    accepted-extensions: ${UPLOAD_ACCEPTED_EXTENSIONS:mp4,mov,webm}
    accepted-content-types: ${UPLOAD_ACCEPTED_CONTENT_TYPES:video/mp4,video/quicktime,video/webm}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  web:
    allowed-origin: ${WEB_ORIGIN:http://localhost:3000}
  dependencies:
    postgres-host: ${POSTGRES_HOST:localhost}
    postgres-port: ${POSTGRES_PORT:5432}
    rabbitmq-host: ${RABBITMQ_HOST:localhost}
    rabbitmq-port: ${RABBITMQ_PORT:5672}
    storage-health-url: ${OBJECT_STORAGE_HEALTH_URL:http://localhost:9000/minio/health/live}
  messaging:
    enabled: ${RABBITMQ_ENABLED:true}
    publisher-delay-ms: ${RABBITMQ_PUBLISHER_DELAY_MS:1000}
    max-priority: ${RABBITMQ_MAX_PRIORITY:10}
    metrics-poll-interval-ms: ${RABBITMQ_METRICS_POLL_INTERVAL_MS:15000}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
    sample-probability: ${TRACE_SAMPLE_PROBABILITY:1.0}
  vision:
    smart-reframing-enabled: ${AI_SMART_CROP:${SMART_REFRAMING_ENABLED:false}}
    provider: ${VISION_PROVIDER:deterministic}
  external-import:
    enabled: ${EXTERNAL_VIDEO_IMPORT:false}
    fixture-adapter-enabled: ${EXTERNAL_IMPORT_FIXTURE_ADAPTER_ENABLED:false}
    max-file-size-bytes: ${EXTERNAL_IMPORT_MAX_FILE_SIZE_BYTES:2147483648}
    max-duration: ${EXTERNAL_IMPORT_MAX_DURATION:2h}
    timeout: ${EXTERNAL_IMPORT_TIMEOUT:5m}
    max-attempts: ${EXTERNAL_IMPORT_MAX_ATTEMPTS:3}
    retry-backoff: ${EXTERNAL_IMPORT_RETRY_BACKOFF:250ms}
  feature-flags:
    ai-smart-crop: ${AI_SMART_CROP:${SMART_REFRAMING_ENABLED:false}}
    face-tracking: ${FACE_TRACKING:false}
    multimodal-analysis: ${MULTIMODAL_ANALYSIS:false}
    auto-zoom: ${AUTO_ZOOM:false}
    external-video-import: ${EXTERNAL_VIDEO_IMPORT:false}
  usage:
    free:
      monthly-processing-minutes: ${FREE_MONTHLY_PROCESSING_MINUTES:60}
      max-file-size-bytes: ${FREE_MAX_FILE_SIZE_BYTES:536870912}
      max-duration-seconds: ${FREE_MAX_DURATION_SECONDS:7200}
      max-storage-bytes: ${FREE_MAX_STORAGE_BYTES:5368709120}
      max-concurrent-jobs: ${FREE_MAX_CONCURRENT_JOBS:1}
      worker-priority: ${FREE_WORKER_PRIORITY:0}
      max-width: ${FREE_MAX_VIDEO_WIDTH:1920}
      max-height: ${FREE_MAX_VIDEO_HEIGHT:1920}
      retention:
        original-days: ${FREE_RETENTION_ORIGINAL_DAYS:30}
        audio-days: ${FREE_RETENTION_AUDIO_DAYS:7}
        frames-days: ${FREE_RETENTION_FRAMES_DAYS:3}
        preview-days: ${FREE_RETENTION_PREVIEW_DAYS:7}
        final-days: ${FREE_RETENTION_FINAL_DAYS:30}
        thumbnail-days: ${FREE_RETENTION_THUMBNAIL_DAYS:30}
        failed-job-artifact-days: ${FREE_RETENTION_FAILED_JOB_DAYS:7}
    pro:
      monthly-processing-minutes: ${PRO_MONTHLY_PROCESSING_MINUTES:600}
      max-file-size-bytes: ${PRO_MAX_FILE_SIZE_BYTES:2147483648}
      max-duration-seconds: ${PRO_MAX_DURATION_SECONDS:7200}
      max-storage-bytes: ${PRO_MAX_STORAGE_BYTES:53687091200}
      max-concurrent-jobs: ${PRO_MAX_CONCURRENT_JOBS:3}
      worker-priority: ${PRO_WORKER_PRIORITY:5}
      max-width: ${PRO_MAX_VIDEO_WIDTH:3840}
      max-height: ${PRO_MAX_VIDEO_HEIGHT:3840}
      retention:
        original-days: ${PRO_RETENTION_ORIGINAL_DAYS:90}
        audio-days: ${PRO_RETENTION_AUDIO_DAYS:30}
        frames-days: ${PRO_RETENTION_FRAMES_DAYS:14}
        preview-days: ${PRO_RETENTION_PREVIEW_DAYS:30}
        final-days: ${PRO_RETENTION_FINAL_DAYS:90}
        thumbnail-days: ${PRO_RETENTION_THUMBNAIL_DAYS:90}
        failed-job-artifact-days: ${PRO_RETENTION_FAILED_JOB_DAYS:14}
    costs:
      transcription-per-minute: ${COST_TRANSCRIPTION_PER_MINUTE:0}
      multimodal-per-minute: ${COST_MULTIMODAL_PER_MINUTE:0}
      llm-per-thousand-tokens: ${COST_LLM_PER_THOUSAND_TOKENS:0}
      cpu-per-second: ${COST_CPU_PER_SECOND:0}
      gpu-per-second: ${COST_GPU_PER_SECOND:0}
      storage-per-gib-month: ${COST_STORAGE_PER_GIB_MONTH:0}
      bandwidth-per-gib: ${COST_BANDWIDTH_PER_GIB:0}
  subscription:
    pro-monthly-price-minor-units: ${PRO_MONTHLY_PRICE_MINOR_UNITS:0}
    currency: ${SUBSCRIPTION_CURRENCY:USD}
    checkout-ttl: ${SUBSCRIPTION_CHECKOUT_TTL:30m}
  payments:
    sandbox:
      enabled: ${PAYMENT_SANDBOX_ENABLED:false}
      webhook-secret: ${PAYMENT_SANDBOX_WEBHOOK_SECRET:}
      signature-tolerance-seconds: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:300}
      checkout-base-url: ${PAYMENT_SANDBOX_CHECKOUT_URL:http://localhost:3000/dashboard/subscription}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      window: ${RATE_LIMIT_WINDOW:1m}
      initial-block: ${RATE_LIMIT_INITIAL_BLOCK:30s}
      maximum-block: ${RATE_LIMIT_MAXIMUM_BLOCK:15m}
      violation-cooldown: ${RATE_LIMIT_VIOLATION_COOLDOWN:1h}
      counter-retention: ${RATE_LIMIT_COUNTER_RETENTION:24h}
      cleanup-delay-ms: ${RATE_LIMIT_CLEANUP_DELAY_MS:3600000}
      operations:
        auth-login:
          ip-requests: ${RATE_LIMIT_AUTH_LOGIN_IP:10}
          user-requests: 0
        auth-register:
          ip-requests: ${RATE_LIMIT_AUTH_REGISTER_IP:5}
          user-requests: 0
        auth-refresh:
          ip-requests: ${RATE_LIMIT_AUTH_REFRESH_IP:20}
          user-requests: 10
        auth-logout:
          ip-requests: 20
          user-requests: 10
        account-delete:
          ip-requests: 5
          user-requests: 2
        video-upload:
          ip-requests: 40
          user-requests: 20
        video-import:
          ip-requests: 10
          user-requests: 3
        import-cancel:
          ip-requests: 10
          user-requests: 5
        video-delete:
          ip-requests: 10
          user-requests: 5
        project-delete:
          ip-requests: 5
          user-requests: 3
        video-process:
          ip-requests: 30
          user-requests: 10
        transcription-request:
          ip-requests: 30
          user-requests: 10
        clip-analysis-request:
          ip-requests: 30
          user-requests: 10
        clip-create:
          ip-requests: 30
          user-requests: 10
        clip-generate:
          ip-requests: 60
          user-requests: 20
        render-request:
          ip-requests: 20
          user-requests: 8
        render-retry:
          ip-requests: 10
          user-requests: 5
        download-url:
          ip-requests: 60
          user-requests: 30
        publication-generate:
          ip-requests: 30
          user-requests: 10
        subscription-checkout:
          ip-requests: 5
          user-requests: 3
        subscription-cancel:
          ip-requests: 5
          user-requests: 3
        payment-webhook:
          ip-requests: 120
          user-requests: 0
    audit:
      enabled: ${SECURITY_AUDIT_ENABLED:true}
      retention-days: ${SECURITY_AUDIT_RETENTION_DAYS:365}
      cleanup-delay-ms: ${SECURITY_AUDIT_CLEANUP_DELAY_MS:86400000}
