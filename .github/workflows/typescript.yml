name: TypeScript

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Typecheck
        run: npx --yes --package typescript@5.7.2 tsc --project tsconfig.base.json
