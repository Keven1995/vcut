name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  api:
    name: API quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: bash ./mvnw -B -ntp -pl apps/api -am verify
      - run: bash ./mvnw -B -ntp spotless:check

  workers:
    name: Worker quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/workers/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --editable .
      - run: ruff check src tests
      - run: mypy src tests
      - run: pytest
      - run: python -m build --wheel

  security-scans:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
      - name: Build patched local PostgreSQL image
        run: docker build --file infrastructure/docker/postgres.Dockerfile --tag vcut/postgres:16.14-alpine3.22 .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vcut/postgres:16.14-alpine3.22
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
      - name: Scan for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.24.2
          git --config=/repo/.gitleaks.toml --gitleaks-ignore-path=/repo/.gitleaksignore --redact --exit-code=1 /repo

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  authorization:
    name: Authorization regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: bash ./mvnw -B -ntp -pl apps/api -Dtest=SecurityContractTest,JwtAuthenticationFilterTest,AccountControllerTest test
