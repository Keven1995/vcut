x-worker-environment: &worker-environment
  APP_ENV: ${APP_ENV:-local}
  WORKER_CONSUME: "true"
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-1}
  WORKER_HEALTH_PORT: "8090"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  RABBITMQ_COMMAND_QUEUE: ${RABBITMQ_COMMAND_QUEUE:-vcut.pipeline.commands.video-validation}
  RABBITMQ_TRANSCRIPTION_QUEUE: ${RABBITMQ_TRANSCRIPTION_QUEUE:-vcut.pipeline.commands.transcription}
  RABBITMQ_CLIP_ANALYSIS_QUEUE: ${RABBITMQ_CLIP_ANALYSIS_QUEUE:-vcut.pipeline.commands.clip-analysis}
  RABBITMQ_CLIP_GENERATION_QUEUE: ${RABBITMQ_CLIP_GENERATION_QUEUE:-vcut.pipeline.commands.clip-generation}
  RABBITMQ_FINAL_RENDER_QUEUE: ${RABBITMQ_FINAL_RENDER_QUEUE:-vcut.pipeline.commands.final-render}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_HEALTH_URL: http://minio:9000/minio/health/live
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vcut-local}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
  OBJECT_STORAGE_PATH_STYLE: ${OBJECT_STORAGE_PATH_STYLE:-true}
  FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
  FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
  FFMPEG_MAX_TEMP_BYTES: ${FFMPEG_MAX_TEMP_BYTES:-4294967296}
  FFMPEG_MAX_MEMORY_BYTES: ${FFMPEG_MAX_MEMORY_BYTES:-1073741824}
  MULTIMODAL_ANALYSIS: ${MULTIMODAL_ANALYSIS:-false}
  MULTIMODAL_ANALYSIS_PROVIDER: ${MULTIMODAL_ANALYSIS_PROVIDER:-deterministic}
  AI_SMART_CROP: ${AI_SMART_CROP:-false}
  FACE_TRACKING: ${FACE_TRACKING:-false}
  VISION_PROVIDER: ${VISION_PROVIDER:-deterministic}
  CLIP_GENERATION_ENABLED: ${CLIP_GENERATION_ENABLED:-true}

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: infrastructure/docker/workers.Dockerfile
  restart: unless-stopped
  environment: *worker-environment
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=5)"
    interval: 10s
    timeout: 6s
    retries: 6
    start_period: 15s
  networks:
    - vcut-local

services:
  postgres:
    image: vcut/postgres:16.14-alpine3.22
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vcut-local

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vcut-local

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - vcut-local

  minio:
    image: cleanstart/minio@sha256:25a88377f4c16dad1d93fbbecc95365b72bb9c32ed59b74b4bc047234d2e4578
    command: server /data --console-address ":9001"
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vcut-local

  workers-cpu:
    <<: *worker-common
    profiles: [workers-cpu, worker-pools]
    environment:
      <<: *worker-environment
      WORKER_NAME: vcut-worker-cpu
      WORKER_POOL: cpu

  workers-ai:
    <<: *worker-common
    profiles: [workers-ai, worker-pools]
    environment:
      <<: *worker-environment
      WORKER_NAME: vcut-worker-ai
      WORKER_POOL: ai

  workers-vision:
    <<: *worker-common
    profiles: [workers-vision, worker-pools]
    environment:
      <<: *worker-environment
      WORKER_NAME: vcut-worker-vision
      WORKER_POOL: vision

  workers-render:
    <<: *worker-common
    profiles: [workers-render, worker-pools]
    environment:
      <<: *worker-environment
      WORKER_NAME: vcut-worker-render
      WORKER_POOL: render

volumes:
  postgres_data:
    name: vcut_postgres_data
  rabbitmq_data:
    name: vcut_rabbitmq_data
  minio_data:
    name: vcut_minio_data

networks:
  vcut-local:
    name: vcut_local
