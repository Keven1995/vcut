version: 1
status: provisional

upload:
  maxFileSizeBytes: 2147483648
  maxDurationSeconds: 7200
  acceptedVideoContainers:
    - mp4
    - mov
    - webm
  acceptedAudioContainers:
    - wav
    - mp3
    - m4a

retention:
  normalizedUsesOriginalMediaDays: true

quotas:
  free:
    monthlyProcessingMinutes: 60
    concurrentJobs: 1
    maxFileSizeBytes: 536870912
    maxDurationSeconds: 7200
    maxStorageBytes: 5368709120
    maxWidth: 1920
    maxHeight: 1920
    retentionDays:
      original: 30
      audio: 7
      frames: 3
      preview: 7
      final: 30
      thumbnail: 30
      failedJobArtifact: 7
  pro:
    monthlyProcessingMinutes: 600
    concurrentJobs: 3
    maxFileSizeBytes: 2147483648
    maxDurationSeconds: 7200
    maxStorageBytes: 53687091200
    maxWidth: 3840
    maxHeight: 3840
    retentionDays:
      original: 90
      audio: 30
      frames: 14
      preview: 30
      final: 90
      thumbnail: 90
      failedJobArtifact: 14

usageCostRates:
  currency: USD
  transcriptionPerMinute: 0
  multimodalPerMinute: 0
  llmPerThousandTokens: 0
  cpuPerSecond: 0
  gpuPerSecond: 0
  storagePerGiBMonth: 0
  bandwidthPerGiB: 0

retentionCleanup:
  enabled: false
  dryRun: true
  intervalSeconds: 3600
  batchSize: 100

processing:
  maxClipDurationSeconds: 90
  maxClipsPerRequest: 20
  maxRetries: 3

vision:
  smartReframingEnabled: false
  provider: deterministic
  sceneThreshold: 0.4
  frameIntervalSeconds: 1
  maxFramesPerClip: 180
  faceConfidence: 0.5

externalImport:
  enabled: false
  fixtureAdapterEnabled: false
  maxFileSizeBytes: 2147483648
  maxDurationSeconds: 7200
  timeoutSeconds: 300
  maxAttempts: 3
  retryBackoffMilliseconds: 250

experimentalFeatures:
  AI_SMART_CROP: false
  FACE_TRACKING: false
  MULTIMODAL_ANALYSIS: false
  AUTO_ZOOM: false
  EXTERNAL_VIDEO_IMPORT: false
